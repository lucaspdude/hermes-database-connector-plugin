name: database-connector
manifest_version: 2
version: 0.1.0
description: Database connector for SQL Server, PostgreSQL and Redis — connections, query log and status for the Hermes Desktop
requires_hermes: ">=0.23"
python_dependencies:
  - "psycopg[binary]>=3.1,<4"
  - "redis>=5,<7"
  - "pymssql>=2.3,<3"
config_schema:
  log_statement:
    type: bool
    default: true
    label: "Registrar statement no log"
    description: >-
      Grava o texto da consulta no log de consultas, sempre redigido (até 500
      caracteres, literais mascarados e sem comentário). Desligue para manter
      apenas os metadados (conexão, engine, duração e linhas) no log e nos
      eventos. O erro nunca carrega senha, DSN ou host, ligado ou desligado.
provides_tools:
  - db_list_connections
  - db_query
  - db_redis_command
provides_hooks: []
